name: Visual Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/visual-smoke.yml'
      - 'ci/fix_generated_gd.py'
      - 'ci/a17_chunks/**'
      - 'ci/apply_a171.py'
      - 'ci/a17_polish.gd'
      - 'ci/apply_a17_polish.py'
      - 'ci/apply_a18.py'
      - 'ci/a18_real3d.gd'
      - 'ci/apply_a19.py'
      - 'ci/a19_detail3d.gd'

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Prepare A1.9
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'After_Zero_A1_6_Source*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          rm -rf .ci_source
          mkdir .ci_source
          unzip -q "$ZIP_FILE" -d .ci_source
          PROJECT_DIR="$(find .ci_source -name project.godot -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .
          cat ci/a17_chunks/chunk_* > /tmp/apply_a17.py
          python /tmp/apply_a17.py
          python ci/apply_a171.py
          python ci/fix_generated_gd.py
          python ci/apply_a17_polish.py
          python ci/apply_a18.py
          python ci/fix_generated_gd.py
          python ci/apply_a19.py
          python ci/fix_generated_gd.py
          godot --headless --editor --quit --path .
          test -d .godot/imported
          mkdir -p tests
          cat > tests/render_probe.gd <<'GDSCRIPT'
          extends SceneTree

          var scene: Node
          var player: Node3D

          func _initialize() -> void:
          	var packed := load("res://scenes/main.tscn")
          	if packed == null:
          		push_error("RENDER_PROBE: main scene failed to load")
          		quit(2)
          		return
          	scene = packed.instantiate()
          	root.add_child(scene)
          	call_deferred("_run")

          func _wait_frames(count: int) -> void:
          	for i in range(count):
          		await process_frame

          func _shot(path: String) -> void:
          	await _wait_frames(10)
          	var image := root.get_texture().get_image()
          	if image == null or image.is_empty():
          		push_error("RENDER_PROBE: viewport image empty for " + path)
          		return
          	var err := image.save_png("res://" + path)
          	print("RENDER_PROBE ", path, " saved=", err, " size=", image.get_width(), "x", image.get_height())

          func _run() -> void:
          	await _wait_frames(35)
          	player = scene.get("player")
          	if player == null:
          		push_error("RENDER_PROBE: player missing")
          		quit(3)
          		return

          	# 1. Actual story start inside the workshop.
          	await _shot("workshop_probe.png")

          	# 2. Main Street composition.
          	player.position = Vector3(0.0, 0.35, 31.0)
          	player.rotation_degrees.y = 0.0
          	await _shot("street_probe.png")

          	# 3. Pine Ridge Market facade.
          	player.position = Vector3(0.0, 0.35, 22.0)
          	player.rotation_degrees.y = -90.0
          	await _shot("market_probe.png")

          	quit(0)
          GDSCRIPT

      - name: Render A1.9 views under Xvfb
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility --script tests/render_probe.gd 2>&1 | tee render_probe.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid access|Invalid assignment|No loader found for resource" render_probe.log; then
            echo "Render probe found runtime errors"
            exit 1
          fi
          test -f workshop_probe.png
          test -f street_probe.png
          test -f market_probe.png

      - name: Upload probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfterZero-A1.9-visual-smoke
          path: |
            workshop_probe.png
            street_probe.png
            market_probe.png
            render_probe.log
          if-no-files-found: error
          retention-days: 7
