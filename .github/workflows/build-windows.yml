name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Prepare source package
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'After_Zero_A1_6_Source*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          rm -rf .ci_source
          mkdir .ci_source
          unzip -q "$ZIP_FILE" -d .ci_source
          PROJECT_DIR="$(find .ci_source -name project.godot -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .
          test -f project.godot
          test -f export_presets.cfg
          python ci/fix_generated_gd.py
          echo "Godot: $(godot --version)"

      - name: Runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 15s godot --headless --path . --quit-after 5 2>&1 | tee runtime-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" runtime-smoke.log; then
            echo "Runtime script validation failed"
            exit 1
          fi

      - name: Export Windows x64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/AfterZero.exe
          test -f build/AfterZero.exe

      - name: Package Windows build
        shell: bash
        run: |
          set -euo pipefail
          cd build
          if [ -f AfterZero.pck ]; then
            zip -9 AfterZero-Windows-x64.zip AfterZero.exe AfterZero.pck
          else
            zip -9 AfterZero-Windows-x64.zip AfterZero.exe
          fi

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AfterZero-Windows-x64
          path: build/AfterZero-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfterZero-runtime-log
          path: runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 7
