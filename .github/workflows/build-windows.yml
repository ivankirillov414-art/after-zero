name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source package
        shell: bash
        run: |
          set -e
          if [ -f After_Zero_A1_6_Source.zip ]; then
            rm -rf .ci_source
            mkdir .ci_source
            unzip -q After_Zero_A1_6_Source.zip -d .ci_source
            PROJECT_DIR="$(find .ci_source -name project.godot -printf '%h\n' | head -n 1)"
            test -n "$PROJECT_DIR"
            cp -a "$PROJECT_DIR"/. .
          fi
          test -f project.godot
          test -f export_presets.cfg

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Export Windows x64
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/AfterZero.exe

      - name: Verify executable
        run: test -f build/AfterZero.exe

      - name: Package
        run: |
          cd build
          if [ -f AfterZero.pck ]; then
            zip -9 AfterZero-Windows-x64.zip AfterZero.exe AfterZero.pck
          else
            zip -9 AfterZero-Windows-x64.zip AfterZero.exe
          fi

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AfterZero-Windows-x64
          path: build/AfterZero-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
