name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Prepare A1.7 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'After_Zero_A1_6_Source*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          rm -rf .ci_source
          mkdir .ci_source
          unzip -q "$ZIP_FILE" -d .ci_source
          PROJECT_DIR="$(find .ci_source -name project.godot -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .
          test -f project.godot
          test -f export_presets.cfg
          cat ci/a17_chunks/chunk_* > /tmp/apply_a17.py
          python /tmp/apply_a17.py
          python ci/apply_a171.py
          python ci/fix_generated_gd.py
          test -f scripts/visual_a17.gd
          grep -q '0.1.7' project.godot
          echo "Godot: $(godot --version)"

      - name: Runtime smoke test gameplay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests
          cat > tests/runtime_probe.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
          	var packed := load("res://scenes/main.tscn")
          	if packed == null:
          		push_error("RUNTIME_PROBE: gameplay scene failed to load")
          		quit(2)
          		return
          	var scene = packed.instantiate()
          	root.add_child(scene)
          	call_deferred("_finish")

          func _finish() -> void:
          	for i in range(20):
          		await process_frame
          	print("RUNTIME_PROBE: gameplay instantiated")
          	quit(0)
          GDSCRIPT
          set -o pipefail
          timeout 25s godot --headless --path . --script tests/runtime_probe.gd 2>&1 | tee runtime-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid access|Invalid assignment" runtime-smoke.log; then
            echo "Runtime validation failed"
            exit 1
          fi

      - name: Export Windows x64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/AfterZero.exe
          test -f build/AfterZero.exe

      - name: Package Windows build
        shell: bash
        run: |
          set -euo pipefail
          cd build
          if [ -f AfterZero.pck ]; then
            zip -9 AfterZero-A1.7-Windows-x64.zip AfterZero.exe AfterZero.pck
          else
            zip -9 AfterZero-A1.7-Windows-x64.zip AfterZero.exe
          fi

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AfterZero-A1.7-Windows-x64
          path: build/AfterZero-A1.7-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfterZero-A1.7-runtime-log
          path: runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 7
